name: CI

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # gradlew is committed without the executable bit
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Fails if a module's public API differs from its committed api/<module>.api dump.
      # For an intended change, run ./gradlew apiDump and commit the updated dump.
      - name: Public API check
        run: ./gradlew apiCheck

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Coverage report
        if: success() || failure()
        run: |
          ./gradlew :koverXmlReport :koverHtmlReport :koverLog --console=plain | tee coverage.log
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          grep -i "coverage:" coverage.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage
          path: build/reports/kover/

      - name: Lint
        run: ./gradlew lintDebug --continue

      - name: Assemble and publish to Maven Local
        run: ./gradlew assembleRelease publishReleasePublicationToMavenLocal

      - name: API reference builds
        run: ./gradlew :dokkaGenerate

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
