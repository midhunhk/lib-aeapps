name: CI

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # gradlew is committed without the executable bit
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Coverage report
        if: success() || failure()
        run: |
          ./gradlew :koverXmlReport :koverHtmlReport :koverLog --console=plain | tee coverage.log
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          grep -i "coverage:" coverage.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: build/reports/kover/

      - name: Lint
        run: ./gradlew lintDebug --continue

      - name: Assemble and publish to Maven Local
        run: ./gradlew assembleRelease publishReleasePublicationToMavenLocal

      - name: API reference builds
        run: ./gradlew :dokkaGenerate

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
