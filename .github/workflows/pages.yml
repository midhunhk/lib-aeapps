name: Docs site

# Builds the documentation site from docs/ and deploys it to GitHub Pages.
#
# docs/index.html, docs/assets and docs/resources are committed. The API reference
# (docs/api) and the release notes page (docs/release_notes.html) are not: they are
# generated here by ./gradlew updateSite, which also sets the version shown in the
# landing page's dependency snippet from aeapps.version in gradle.properties.
#
# Runs when a release tag is pushed, and on demand from the Actions tab (for example after
# editing docs/index.html between releases). See "Documentation site" in DEVELOPMENT.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # gradlew is committed without the executable bit
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate API reference, release notes and site version
        run: ./gradlew updateSite

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
